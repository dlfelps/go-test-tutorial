name: Go Test Tutorial CI

on:
  push:
    branches: [ main-new, main, master ]
  pull_request:
    branches: [ main-new, main, master ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Go 1.19
      uses: actions/setup-go@v4
      with:
        go-version: '1.19'
        cache: true
    
    - name: Install dependencies
      run: go mod download
    
    - name: Verify dependencies
      run: go mod verify
    
    - name: Build
      run: |
        # Set build date and git commit hash
        BUILD_DATE=$(date -u +"%Y-%m-%d")
        GIT_COMMIT=$(git rev-parse --short HEAD)
        VERSION=$(grep -m 1 "go " go.mod | cut -d ' ' -f 2)
        
        # Pass version information to the build
        go build -v -ldflags "-X 'go-test-tutorial/cmd.Version=v1.0.0' -X 'go-test-tutorial/cmd.BuildDate=$BUILD_DATE' -X 'go-test-tutorial/cmd.GitCommit=$GIT_COMMIT'" -o gotest-learn
    
    - name: Run tests with coverage
      run: |
        go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
        
        # Generate coverage summary instead of using external service
        go tool cover -func=coverage.out
    
    - name: Run examples tests
      run: cd examples/calc && go test -v ./...
    
    - name: Run benchmarks
      run: cd examples/calc && go test -bench=. -benchmem
    
    - name: Check for race conditions
      run: go test -race -short ./...
    
    # Removed formatting check
    
    - name: Run go vet
      run: go vet ./...    
  
    # Skip artifact upload for now
    - name: Archive build
      run: tar -czf gotest-learn.tar.gz gotest-learn

  release:
    name: Release Build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main-new' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Go 1.19
      uses: actions/setup-go@v4
      with:
        go-version: '1.19'
        cache: true
    
    - name: Build for multiple platforms
      run: |
        # Set build date and git commit hash
        BUILD_DATE=$(date -u +"%Y-%m-%d")
        GIT_COMMIT=$(git rev-parse --short HEAD)
        
        # Common build flags
        LDFLAGS="-X 'go-test-tutorial/cmd.Version=v1.0.0' -X 'go-test-tutorial/cmd.BuildDate=$BUILD_DATE' -X 'go-test-tutorial/cmd.GitCommit=$GIT_COMMIT'"
        
        # Build for Linux
        GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o gotest-learn-linux-amd64
        
        # Build for Windows
        GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o gotest-learn-windows-amd64.exe
        
        # Build for macOS
        GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o gotest-learn-darwin-amd64
    
    # Archive builds instead of using upload-artifact action
    - name: Archive builds for release
      run: |
        mkdir -p release-builds
        cp gotest-learn-linux-amd64 release-builds/
        cp gotest-learn-windows-amd64.exe release-builds/
        cp gotest-learn-darwin-amd64 release-builds/
        tar -czf gotest-learn-release-builds.tar.gz release-builds/